name: Data correction or addition
description: 'Fix or add a row in a structured registry: market map companies, datasets, hardware, teleop rigs, methods, glossary, or citations.'
title: 'fix(data): '
labels: ['documentation', 'data']
body:
  - type: markdown
    attributes:
      value: |
        Every structured registry is Zod-validated at import time, so a malformed or unsourced row fails the
        build rather than shipping. Two rules decide most of these issues: every row carries at least one
        source link, and a value nobody publishes stays `null` (rendered as "not disclosed") instead of being
        estimated.
  - type: dropdown
    id: registry
    attributes:
      label: Which registry
      options:
        - Market map companies (data/companies.ts, generated from research/04-market-map-companies.json)
        - Datasets (data/datasets.ts)
        - Hardware (data/hardware.ts)
        - Teleoperation rigs (data/teleop-rigs.ts)
        - Methods (data/methods.ts)
        - Glossary terms (data/glossary.ts)
        - Citation registry (data/citations.ts)
        - Images and figures (data/images.ts)
    validations:
      required: true
  - type: dropdown
    id: change
    attributes:
      label: Kind of change
      options:
        - Correct a field on an existing row
        - Add a new row
        - Replace an invented or stale value with "not disclosed"
        - Remove a row (duplicate, defunct, or out of scope)
        - Fix a dead or redirected source link
    validations:
      required: true
  - type: input
    id: entry
    attributes:
      label: Entry id or name
      description: The row's `id` if you know it, otherwise the display name as it appears on the site.
      placeholder: physical-intelligence
    validations:
      required: true
  - type: textarea
    id: fields
    attributes:
      label: Fields and values
      description: >
        One field per line as `field: current -> proposed`. For a new row, list every field you can support
        with a source and mark the rest unknown. Funding figures need the round type, amount, date, and lead
        investors, or they stay null.
      placeholder: |
        totalRaisedUsd: 400000000 -> 1670000000
        latestRound.date: 2025-11-01 -> 2025-11-20
        hq.city: unknown -> San Francisco
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Source links
      description: >
        One URL per line, mapped to the fields it supports. Where trackers disagree, give each figure with its
        own source: the registries keep the snapshot value plus its sources rather than averaging them.
      placeholder: |
        totalRaisedUsd, latestRound: https://example.com/press/series-b
        hq.city: https://example.com/about
    validations:
      required: true
  - type: input
    id: as-of
    attributes:
      label: As-of date of the sources
      description: ISO date. Funding and deployment numbers are snapshots, so the registries record when they were true.
      placeholder: 2026-08-16
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Before submitting
      options:
        - label: Every value I propose is supported by a source link above, with no estimates or interpolations.
          required: true
        - label: Values no source publishes are left unknown rather than filled in.
          required: true
        - label: For market map rows I understand the edit belongs in research/04-market-map-companies.json, with data/companies.ts regenerated by `npm run generate:companies` (optional; a maintainer can do this).
          required: false
