<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="Temporal ensembling diagram">
  <rect width="640" height="250" fill="#121517"/>

  <!-- Section labels -->
  <text x="60" y="36" font-family="ui-monospace, monospace" font-size="11" fill="#9aa4ab">chunks in flight</text>
  <text x="490" y="36" font-family="ui-monospace, monospace" font-size="11" fill="#9aa4ab">ensemble weights</text>

  <!-- The action being ensembled -->
  <text x="220" y="24" font-family="ui-monospace, monospace" font-size="11" fill="#f5a623" text-anchor="middle">a_t</text>

  <!-- Chunk issued at t-2 -->
  <text x="60" y="52" font-family="ui-monospace, monospace" font-size="10" fill="#9aa4ab">issued at t-2</text>
  <rect x="60" y="56" width="240" height="16" rx="2" fill="#181c1f" stroke="#23282c"/>

  <!-- Chunk issued at t-1 -->
  <text x="140" y="80" font-family="ui-monospace, monospace" font-size="10" fill="#9aa4ab">issued at t-1</text>
  <rect x="140" y="84" width="240" height="16" rx="2" fill="#181c1f" stroke="#23282c"/>

  <!-- Chunk issued at t -->
  <text x="220" y="108" font-family="ui-monospace, monospace" font-size="10" fill="#9aa4ab">issued at t</text>
  <rect x="220" y="112" width="240" height="16" rx="2" fill="#181c1f" stroke="#23282c"/>

  <!-- Prediction line and markers, painted above the chunk bars -->
  <line x1="220" y1="30" x2="220" y2="140" stroke="#f5a623" stroke-width="1" stroke-dasharray="4 4" opacity="0.8"/>
  <circle cx="220" cy="64" r="3" fill="#f5a623"/>
  <circle cx="220" cy="92" r="3" fill="#f5a623"/>
  <circle cx="220" cy="120" r="3" fill="#f5a623"/>

  <!-- Time axis -->
  <line x1="50" y1="160" x2="400" y2="160" stroke="#333a40" stroke-width="1"/>
  <polygon points="400,160 394,157 394,163" fill="#333a40"/>
  <g font-family="ui-monospace, monospace" font-size="11" fill="#9aa4ab" text-anchor="middle">
    <line x1="60" y1="156" x2="60" y2="164" stroke="#333a40"/>
    <text x="60" y="178">t-2</text>
    <line x1="140" y1="156" x2="140" y2="164" stroke="#333a40"/>
    <text x="140" y="178">t-1</text>
    <line x1="220" y1="156" x2="220" y2="164" stroke="#333a40"/>
    <text x="220" y="178">t</text>
    <line x1="300" y1="156" x2="300" y2="164" stroke="#333a40"/>
    <text x="300" y="178">t+1</text>
    <line x1="380" y1="156" x2="380" y2="164" stroke="#333a40"/>
    <text x="380" y="178">t+2</text>
  </g>
  <text x="50" y="196" font-family="ui-monospace, monospace" font-size="10" fill="#9aa4ab">control steps</text>

  <!-- Ensemble weight bars (aligned with chunk rows; newest dominates) -->
  <rect x="490" y="58" width="44" height="12" rx="2" fill="#f5a623" opacity="0.45"/>
  <text x="540" y="68" font-family="ui-monospace, monospace" font-size="10" fill="#e8eaec">0.37</text>
  <rect x="490" y="86" width="73" height="12" rx="2" fill="#f5a623" opacity="0.65"/>
  <text x="569" y="96" font-family="ui-monospace, monospace" font-size="10" fill="#e8eaec">0.61</text>
  <rect x="490" y="114" width="120" height="12" rx="2" fill="#f5a623" opacity="0.95"/>
  <text x="614" y="124" font-family="ui-monospace, monospace" font-size="10" fill="#e8eaec">1.00</text>
  <text x="490" y="150" font-family="ui-monospace, monospace" font-size="11" fill="#9aa4ab">w_i = exp(-m i)</text>
</svg>
