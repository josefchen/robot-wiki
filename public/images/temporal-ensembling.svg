<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="Temporal ensembling diagram">
  <!-- brand-v2 palette: ink ground, graphite chunk blocks, concrete linework
       and labels, lime for the ensembled action and its weights. Only fill,
       stroke, stroke-width and opacity move; the geometry and the label text
       are pinned by the normalized semantic baseline (VAL-B2-VIZ-014). The
       three weight opacities stay 0.45 / 0.65 / 0.95 because they encode the
       reported weights beside them and are not styling. -->
  <rect width="640" height="250" fill="#0B0B0C"/>

  <!-- Section labels -->
  <text x="60" y="36" font-family="ui-monospace, monospace" font-size="11" fill="#D9DADB">chunks in flight</text>
  <text x="490" y="36" font-family="ui-monospace, monospace" font-size="11" fill="#D9DADB">ensemble weights</text>

  <!-- The action being ensembled -->
  <text x="220" y="24" font-family="ui-monospace, monospace" font-size="11" fill="#C6FF19" text-anchor="middle">a_t</text>

  <!-- Chunk issued at t-2 -->
  <text x="60" y="52" font-family="ui-monospace, monospace" font-size="10" fill="#D9DADB">issued at t-2</text>
  <rect x="60" y="56" width="240" height="16" rx="2" fill="#242D33" stroke="#D9DADB" opacity="0.55"/>

  <!-- Chunk issued at t-1 -->
  <text x="140" y="80" font-family="ui-monospace, monospace" font-size="10" fill="#D9DADB">issued at t-1</text>
  <rect x="140" y="84" width="240" height="16" rx="2" fill="#242D33" stroke="#D9DADB" opacity="0.55"/>

  <!-- Chunk issued at t -->
  <text x="220" y="108" font-family="ui-monospace, monospace" font-size="10" fill="#D9DADB">issued at t</text>
  <rect x="220" y="112" width="240" height="16" rx="2" fill="#242D33" stroke="#D9DADB" opacity="0.55"/>

  <!-- Prediction line and markers, painted above the chunk bars -->
  <line x1="220" y1="30" x2="220" y2="140" stroke="#C6FF19" stroke-width="1" stroke-dasharray="4 4" opacity="0.8"/>
  <circle cx="220" cy="64" r="3" fill="#C6FF19"/>
  <circle cx="220" cy="92" r="3" fill="#C6FF19"/>
  <circle cx="220" cy="120" r="3" fill="#C6FF19"/>

  <!-- Time axis -->
  <line x1="50" y1="160" x2="400" y2="160" stroke="#D9DADB" stroke-width="1" opacity="0.5"/>
  <polygon points="400,160 394,157 394,163" fill="#D9DADB" opacity="0.5"/>
  <g font-family="ui-monospace, monospace" font-size="11" fill="#D9DADB" text-anchor="middle">
    <line x1="60" y1="156" x2="60" y2="164" stroke="#D9DADB" opacity="0.5"/>
    <text x="60" y="178">t-2</text>
    <line x1="140" y1="156" x2="140" y2="164" stroke="#D9DADB" opacity="0.5"/>
    <text x="140" y="178">t-1</text>
    <line x1="220" y1="156" x2="220" y2="164" stroke="#D9DADB" opacity="0.5"/>
    <text x="220" y="178">t</text>
    <line x1="300" y1="156" x2="300" y2="164" stroke="#D9DADB" opacity="0.5"/>
    <text x="300" y="178">t+1</text>
    <line x1="380" y1="156" x2="380" y2="164" stroke="#D9DADB" opacity="0.5"/>
    <text x="380" y="178">t+2</text>
  </g>
  <text x="50" y="196" font-family="ui-monospace, monospace" font-size="10" fill="#D9DADB">control steps</text>

  <!-- Ensemble weight bars (aligned with chunk rows; newest dominates) -->
  <rect x="490" y="58" width="44" height="12" rx="2" fill="#C6FF19" opacity="0.45"/>
  <text x="540" y="68" font-family="ui-monospace, monospace" font-size="10" fill="#D9DADB">0.37</text>
  <rect x="490" y="86" width="73" height="12" rx="2" fill="#C6FF19" opacity="0.65"/>
  <text x="569" y="96" font-family="ui-monospace, monospace" font-size="10" fill="#D9DADB">0.61</text>
  <rect x="490" y="114" width="120" height="12" rx="2" fill="#C6FF19" opacity="0.95"/>
  <text x="614" y="124" font-family="ui-monospace, monospace" font-size="10" fill="#D9DADB">1.00</text>
  <text x="490" y="150" font-family="ui-monospace, monospace" font-size="11" fill="#D9DADB">w_i = exp(-m i)</text>
</svg>
